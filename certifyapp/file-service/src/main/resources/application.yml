spring:
  application:
    name: file-service

certifyapp:
  aws:
    region: ${AWS_REGION:eu-central-1}
    s3-bucket: ${AWS_S3_BUCKET:certifyapp-dev}
    endpoint: ${AWS_S3_ENDPOINT:}
    access-key-id: ${AWS_ACCESS_KEY_ID:}
    secret-access-key: ${AWS_SECRET_ACCESS_KEY:}

server:
  port: 8085

management:
  endpoints:
    web:
      exposure:
        include: health,info
