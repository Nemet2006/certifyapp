spring:
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://auth-service:8087
        - id: user-service
          uri: http://user-service:8082
        - id: certificate-service
          uri: http://certificate-service:8083
        - id: notification-service
          uri: http://notification-service:8084
        - id: file-service
          uri: http://file-service:8085
        - id: payment-service
          uri: http://payment-service:8086
