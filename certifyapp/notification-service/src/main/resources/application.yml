spring:
  application:
    name: notification-service
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:certifyapp}
    password: ${RABBITMQ_PASSWORD:certifyapp}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
  thymeleaf:
    prefix: classpath:/templates/

server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include: health,info
