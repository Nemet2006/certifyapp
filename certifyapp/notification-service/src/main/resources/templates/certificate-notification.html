<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="az">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Sertifikatınız hazırdır</title>
</head>
<body style="margin:0;padding:0;background-color:#f4efe6;font-family:'Segoe UI',Helvetica,Arial,sans-serif;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color:#f4efe6;padding:32px 16px;">
    <tr>
        <td align="center">
            <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;background:#ffffff;border-radius:16px;overflow:hidden;box-shadow:0 4px 24px rgba(10,22,40,0.08);">
                <tr>
                    <td style="background:#0a1628;padding:28px 32px;text-align:center;">
                        <div style="display:inline-block;width:48px;height:48px;background:#c9a227;border-radius:12px;line-height:48px;font-size:24px;color:#0a1628;">✓</div>
                        <h1 style="margin:16px 0 0;font-size:22px;font-weight:600;color:#faf8f4;letter-spacing:-0.02em;">CertifyApp</h1>
                    </td>
                </tr>
                <tr>
                    <td style="padding:32px;">
                        <p style="margin:0 0 8px;font-size:14px;color:#1c3554;text-transform:uppercase;letter-spacing:0.12em;">Yeni sertifikat</p>
                        <h2 style="margin:0 0 20px;font-size:26px;font-weight:600;color:#0a1628;line-height:1.3;">
                            Salam, <span th:text="${userName}">İstifadəçi</span>!
                        </h2>
                        <p style="margin:0 0 24px;font-size:16px;line-height:1.6;color:#1c3554;">
                            Təbrik edirik — sertifikatınız rəsmi olaraq verildi. Aşağıdakı düymə ilə PDF faylınıza baxa bilərsiniz.
                        </p>
                        <table role="presentation" cellspacing="0" cellpadding="0">
                            <tr>
                                <td style="border-radius:8px;background:#0a1628;">
                                    <a th:href="${certificateUrl}" href="#"
                                       style="display:inline-block;padding:14px 28px;font-size:15px;font-weight:600;color:#faf8f4;text-decoration:none;">
                                        Sertifikata bax
                                    </a>
                                </td>
                            </tr>
                        </table>
                        <p style="margin:28px 0 0;font-size:13px;line-height:1.5;color:#1c3554;opacity:0.65;">
                            Bu email avtomatik göndərilib. Suallarınız üçün təşkilatçınızla əlaqə saxlayın.
                        </p>
                    </td>
                </tr>
                <tr>
                    <td style="padding:20px 32px;background:#f4efe6;border-top:1px solid #e8dfd0;text-align:center;">
                        <p style="margin:0;font-size:12px;color:#1c3554;opacity:0.5;">© CertifyApp</p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
