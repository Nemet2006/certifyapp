apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: certifyapp-prod
resources:
  - ../../namespace.yaml
  - ../../configmap.yaml
  - ../../user-service-deployment.yaml
  - ../../auth-service-deployment.yaml
  - ../../api-gateway-deployment.yaml
  - ../../ingress.yaml
patches:
  - target:
      kind: Deployment
      name: user-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
