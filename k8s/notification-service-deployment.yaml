apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: certifyapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: ${ECR_REGISTRY}/certifyapp/notification-service:latest
          ports:
            - containerPort: 8084
          envFrom:
            - configMapRef:
                name: certifyapp-config
            - secretRef:
                name: certifyapp-secrets
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            initialDelaySeconds: 45
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            initialDelaySeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: certifyapp
spec:
  selector:
    app: notification-service
  ports:
    - port: 8084
      targetPort: 8084
