apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: certifyapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: ${ECR_REGISTRY}/certifyapp/user-service:latest
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: certifyapp-config
            - secretRef:
                name: certifyapp-secrets
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            initialDelaySeconds: 60
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            initialDelaySeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: certifyapp
spec:
  selector:
    app: user-service
  ports:
    - port: 8082
      targetPort: 8082
