apiVersion: apps/v1
kind: Deployment
metadata:
  name: file-service
  namespace: certifyapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: file-service
  template:
    metadata:
      labels:
        app: file-service
    spec:
      containers:
        - name: file-service
          image: ${ECR_REGISTRY}/certifyapp/file-service:latest
          ports:
            - containerPort: 8085
          envFrom:
            - configMapRef:
                name: certifyapp-config
            - secretRef:
                name: certifyapp-secrets
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            initialDelaySeconds: 45
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            initialDelaySeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: file-service
  namespace: certifyapp
spec:
  selector:
    app: file-service
  ports:
    - port: 8085
      targetPort: 8085
